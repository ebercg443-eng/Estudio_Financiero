name: Compilar APK Flet

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Requerido por Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Flet
        run: |
          pip install --upgrade pip
          pip install flet

      - name: Compilar APK
        run: flet build apk --verbose

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-android-apk
          path: build/apk/*.apk
